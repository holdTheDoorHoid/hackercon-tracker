name: Refresh conference data

# Every Monday: pull bsides.org, makerfaire.com, cfptime.org and cfp.hex.dance, scan
# unconfirmed conferences' websites for date hints, and commit the updated dataset.
# A commit here republishes the site (see the deploy job) and reaches app users on
# their next `git pull`.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh the dataset
        run: python research/refresh.py --summary-file /tmp/summary.json | tee /tmp/refresh.log
      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- data/seed/conferences.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
            exit 0
          fi
          SUMMARY=$(python -c "import json; print(json.load(open('/tmp/summary.json'))['text'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seed/conferences.json
          git commit -m "$SUMMARY" -m "Automated weekly refresh (research/refresh.py)."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
